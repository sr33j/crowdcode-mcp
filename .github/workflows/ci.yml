name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest
      - run: python -m pytest -q
        env:
          DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
          TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # crowdcode-mcp imports @crowdcode/redaction's types from its dist
      # output, so the workspace dependency must be built before typecheck.
      - run: npm run build -w @crowdcode/redaction
      - run: npm run typecheck -w @crowdcode/redaction -w crowdcode-mcp
      - run: npm test
      - run: npm run check:assets -w crowdcode-mcp
