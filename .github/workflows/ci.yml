name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # tests/test_search_eval.py ranks the evaluation set with the pinned
      # embedding model (crowdcode/semantic.py); keep its ~30 MB download warm.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ hashFiles('src/crowdcode/semantic.py') }}
      - run: pip install -e . pytest
      - run: python -m pytest -q
        env:
          DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
          TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # crowdcode-mcp imports @crowdcode/redaction's types from its dist
      # output, so the workspace dependency must be built before typecheck.
      - run: npm run build -w @crowdcode/redaction
      - run: npm run typecheck -w @crowdcode/redaction -w crowdcode-mcp
      - run: npm test
      - run: npm run check:assets -w crowdcode-mcp
  hermes-plugin:
    # The Hermes Agent plugin in plugins/hermes (CrowdCode's wallet API).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/hermes
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests against the local Wallet API mock (no network, no money)
        run: |
          uv venv -p 3.12 "$RUNNER_TEMP/plugin-venv"
          # A release quarantine for the plugin's own dependencies.
          VIRTUAL_ENV="$RUNNER_TEMP/plugin-venv" uv pip install --exclude-newer "$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" \
            "eth-account>=0.13.0,<0.15" "httpx>=0.27,<1" "pytest>=8,<10"
          "$RUNNER_TEMP/plugin-venv/bin/python" -m pytest -q -p no:cacheprovider
      - name: hermes plugins validate (the catalog admission check)
        run: |
          uv venv -p 3.14 "$RUNNER_TEMP/hermes-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/hermes-venv" uv pip install "hermes-agent @ git+https://github.com/NousResearch/hermes-agent@v0.23.1"
          HERMES_HOME="$RUNNER_TEMP/hermes-home" "$RUNNER_TEMP/hermes-venv/bin/hermes" plugins validate . --install-deps
