name: crowdcode
version: 0.3.0
manifest_version: 2
api_version: 1
description: >-
  Cloud agents with their own wallets. Use your CrowdCode account (sign in
  with Hermes), or create agents owned by this install's Base wallet. Fund
  them with USDC, give them tasks that buy x402/MPP services or deploy paid
  services of their own, withdraw the earnings, and claim wallet-owned agents
  into your account.
author: Srijith Poduval
license: MIT
homepage: https://github.com/sr33j/crowdcode-mcp/tree/main/plugins/hermes
tags: [payments, x402, agents, base, usdc, wallet]
requires_hermes: ">=0.23.0"
provides_tools:
  - crowdcode_wallet
  - crowdcode_agents
  - crowdcode_create_agent
  - crowdcode_fund_agent
  - crowdcode_run_task
  - crowdcode_task_status
  - crowdcode_services
  - crowdcode_withdraw
  - crowdcode_transfer
  - crowdcode_demand
  - crowdcode_files
  - crowdcode_download
  - crowdcode_claim
provides_hooks:
  - pre_tool_call
# Login mode: Hermes runs the OAuth (PKCE) sign-in with `hermes auth add
# crowdcode:crowdcode`, stores and refreshes the grant, and attaches the token
# only to crowdcode.app. The plugin never sees it.
optional_env:
  - name: CROWDCODE_OAUTH_CLIENT_ID
    description: >-
      CrowdCode's public OAuth client id for Hermes ("hermes"; PKCE, no
      secret). /crowdcode login sets it.
oauth:
  - id: crowdcode
    authorize_url: https://crowdcode.app/connect
    token_url: https://crowdcode.app/api/app/oauth/token
    scopes: [read, tasks, transfers, withdraw_to_main, services, files]
    client_id_env: CROWDCODE_OAUTH_CLIENT_ID
    hosts: [crowdcode.app]
config_schema:
  mode:
    type: str
    default: auto
    choices: [auto, account, wallet]
    label: Credential
    description: >-
      account uses your CrowdCode account (sign in with /crowdcode login);
      wallet uses this install's wallet key; auto uses the account when Hermes
      is signed in to one, else the wallet.
  wallet_key:
    type: secret
    env: CROWDCODE_WALLET_KEY
    label: Wallet private key
    description: >-
      Set by /crowdcode wallet init. Paste an existing Base EVM key here only if
      you want to use that wallet instead. Stored in Hermes's credential store.
  approve_above_usd:
    type: float
    default: 0.0
    label: Ask before moving this much or more (USD)
    description: >-
      Money-moving calls (create, fund, task budget, withdraw, transfer) at or
      above this amount go through Hermes's approval prompt. The default 0 asks
      for every one; raise it to skip prompts for smaller amounts.
  daily_cap_usd:
    type: float
    default: 5.0
    label: Daily cap (USD)
    description: >-
      Agent creation, funding and task budgets above this per UTC day are
      blocked. Withdrawals and transfers between your own agents never count.
  always_ask:
    type: bool
    default: false
    label: Ask before every money-moving call
  base_url:
    type: str
    default: https://crowdcode.app
    label: CrowdCode URL
    description: CrowdCode origin (https only; http is accepted for localhost testing).
  base_rpc_url:
    type: str
    default: https://mainnet.base.org
    label: Base RPC URL
    description: Used only to read this wallet's USDC balance.
  max_download_mb:
    type: int
    default: 500
    label: Largest file to download (MB)
    description: crowdcode_download refuses a single file larger than this.
  task_timeout_seconds:
    type: int
    default: 600
    label: Task wait (seconds)
    description: How long crowdcode_run_task waits for a result before returning the task id.
