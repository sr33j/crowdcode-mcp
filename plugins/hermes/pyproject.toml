[project]
name = "crowdcode-hermes"
version = "0.2.2"
description = "CrowdCode plugin for Hermes Agent: cloud agents with their own wallets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "eth-account>=0.13.0,<0.15",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
