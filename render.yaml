services:
  - type: web
    name: crowdcode-backend
    runtime: python
    plan: starter
    buildCommand: pip install -e .
    startCommand: crowdcode-mcp
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: HOST
        value: 0.0.0.0
      - key: MCP_ALLOWED_HOSTS
        value: crowdcode-backend.onrender.com,crowdcode.app,www.crowdcode.app,127.0.0.1:*,localhost:*
      - key: MCP_ALLOWED_ORIGINS
        value: https://crowdcode.app,https://www.crowdcode.app,http://127.0.0.1:*,http://localhost:*
      - key: CORS_ORIGINS
        value: https://crowdcode.app,https://www.crowdcode.app,http://127.0.0.1:5173,http://localhost:5173
      - key: CROWDCODE_REQUESTS_TABLE
        value: service_requests
      - key: PROJECT_IDEAS_CACHE_SECONDS
        value: "86400"
      - key: CROWDCODE_REVIEWER_SALT
        sync: false
      # Wallet-keyed service-request limit (rolling 24h; 0 disables).
      - key: CROWDCODE_REQUEST_LIMIT_PER_DAY
        value: "5"
      # Required redaction sidecar (server-side enforcement backstop). Point
      # at the crowdcode-redactor private service; /ready fails if unavailable.
      - key: REDACTOR_URL
        sync: false
      - key: REDACTOR_TOKEN
        sync: false
      # Operator wallets pinned at trust 1.0 (docs/SCORING.md §3.5).
      - key: CROWDCODE_SEED_WALLETS
        sync: false
      # Token pin for mppx/Tempo payment verification (docs/SCORING.md §3.4).
      # Without it, mppx verification fails closed and stores nothing.
      - key: MPPX_TEMPO_TOKEN_ADDRESS
        value: "0x20C000000000000000000000b9537d11c60E8b50"

  # Nightly batch (docs/SCORING.md §8.2): consistency sweep, per-service
  # review summaries, requested-services summary.
  - type: cron
    name: crowdcode-cron
    runtime: python
    plan: starter
    schedule: "30 6 * * *"
    buildCommand: pip install -e .
    startCommand: crowdcode-cron
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: CROWDCODE_REVIEWER_SALT
        sync: false
      - key: CROWDCODE_SEED_WALLETS
        sync: false
      - key: REDACTOR_URL
        sync: false
      - key: REDACTOR_TOKEN
        sync: false
      # Legacy signature-only re-verification needs the same token pin.
      - key: MPPX_TEMPO_TOKEN_ADDRESS
        value: "0x20C000000000000000000000b9537d11c60E8b50"

  # Internal-only redaction sidecar: same Rampart + secret-recognizer
  # pipeline as crowdcode-mcp, called by the backend on ingest/egress.
  - type: pserv
    name: crowdcode-redactor
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build -w @crowdcode/redaction
    startCommand: node services/redactor/server.mjs
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CROWDCODE_CACHE_DIR
        value: /opt/render/project/.cache/crowdcode-redactor
      - key: REDACTOR_TOKEN
        sync: false

  - type: static
    name: crowdcode-frontend
    buildCommand: ""
    staticPublishPath: frontend
